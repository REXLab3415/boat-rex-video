name: Instagramに投稿(リールと画像。手動・接続の確認と、投稿の送り直し用)

# 毎日の自動投稿:
#   - 昼(日本時間5:00〜20:00)に動いた video.yml は、その場でInstagramに投稿する
#   - 夜(20:00〜翌5:00)に動いた video.yml は、Instagramには投稿しない。代わりに、この流れが毎朝5:07(日本時間)に自動で動き、
#     準備をして、6:00まで待ってから、リールと画像を投稿する(GitHubの実行が遅れて6:00を過ぎたときは、待たずにすぐ投稿する)
# 手動で動かしたときは、待たずに、すぐ動く。
#   check = Instagramに接続できるかを確認するだけ(投稿しない)
#   post  = すでにできているショート(Artifacts・30日以内)を、Xと同じ投稿文でリールに投稿し、続けて、その日のサムネイル画像(ここで作り直す)も同じ投稿文で投稿する
#           投稿済みの部分(リール・画像それぞれ)は、forceにチェックがなければ飛ばす
on:
  schedule:
    - cron: "7 20 * * *"   # 毎朝5:07(日本時間)。GitHubの実行は遅れることがある
  workflow_dispatch:
    inputs:
      mode:
        description: "check=接続の確認だけ(投稿しない) / post=リールに投稿する"
        required: true
        type: choice
        options: [check, post]
        default: check
      date:
        description: "投稿する日(YYYY-MM-DD。例 2026-11-05)。空欄なら、days の中の、いちばん新しい日(postのとき)"
        required: false
        default: ""
      force:
        description: "投稿済みの日でも、もう一度投稿する(リールも画像も)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: instagram-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 接続の確認だけ(投稿しない)
        if: github.event.inputs.mode == 'check'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python instagram_reel.py --check

      - name: できているショートを取り出す
        if: ${{ (github.event.inputs.mode || 'post') == 'post' }}
        id: s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_INPUT: ${{ github.event.inputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            if ! echo "$DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! date -d "$DATE_INPUT" +%Y%m%d > /dev/null 2>&1; then
              echo "::error::日付の形式が正しくありません。2026-11-05 のように入力してください(入力: $DATE_INPUT)"
              exit 1
            fi
            DATE_ARG="$(date -d "$DATE_INPUT" +%Y%m%d)"
          else
            DATE_ARG="$(ls days/*.json | sed -n 's#^days/\([0-9]\{8\}\)\.json$#\1#p' | sort | tail -1)"
          fi
          echo "date=$DATE_ARG" >> "$GITHUB_OUTPUT"
          echo "投稿する日: $DATE_ARG"
          if [ "$EVENT" = "schedule" ] && [ -f "uploaded/${DATE_ARG}_ig.json" ] && [ -f "uploaded/${DATE_ARG}_ig_thumb.json" ]; then
            echo "::notice::${DATE_ARG} は、リールも画像も投稿済みです。何もしません"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=boat-short-$DATE_ARG&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | .[0].workflow_run.id')"
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            if [ "$EVENT" = "schedule" ]; then
              echo "::notice::boat-short-$DATE_ARG のショートがまだありません(的中0件の日か、動画づくりが終わっていない)。朝の自動投稿は、しません"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::boat-short-$DATE_ARG のショート(Artifacts)が見つかりません(作ってから30日で消えます)"
            exit 1
          fi
          gh run download "$RUN_ID" -n "boat-short-$DATE_ARG" -D out
          ls -la out

      - name: サムネイル画像を作り直す(失敗しても、リールの投稿は続ける)
        if: ${{ (github.event.inputs.mode || 'post') == 'post' && steps.s.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          DATE_ARG: ${{ steps.s.outputs.date }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install playwright
          playwright install --with-deps chromium
          python make_thumbnail.py --date "$DATE_ARG" --out out

      - name: 6:00(日本時間)まで待つ(朝の自動実行のときだけ)
        if: ${{ github.event_name == 'schedule' && steps.s.outputs.skip != 'true' }}
        run: |
          NOW=$(date +%s)
          TARGET=$(TZ=Asia/Tokyo date -d "today 06:00" +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 5400 ]; then
            echo "::warning::6:00まで90分より長い($WAIT 秒)ため、待たずに進めます"
          elif [ "$WAIT" -gt 0 ]; then
            echo "6:00まで $WAIT 秒待ちます"
            sleep "$WAIT"
          else
            echo "::notice::6:00を過ぎているため、待たずにすぐ投稿します"
          fi
          # 待っているあいだに、ほかの流れが投稿していないかを見るため、最新の記録を取り込む
          git pull --rebase origin main || echo "::warning::最新の記録を取り込めませんでした"

      - name: Instagramのリールと画像に投稿する
        if: ${{ (github.event.inputs.mode || 'post') == 'post' && steps.s.outputs.skip != 'true' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_ARG: ${{ steps.s.outputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="--force"; fi
          python instagram_reel.py --date "$DATE_ARG" --out out $EXTRA

      - name: 投稿の記録を保存(同じ日の二重投稿を防ぐ)
        if: ${{ (github.event.inputs.mode || 'post') == 'post' && steps.s.outputs.skip != 'true' }}
        run: |
          if [ -n "$(git status --porcelain uploaded)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uploaded
            git commit -m "Instagram投稿の記録"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            echo "::warning::投稿の記録を保存できませんでした。同じ日をもう一度動かすと、二重に投稿されます"
            exit 1
          fi
