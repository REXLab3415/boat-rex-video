name: 答え合わせ動画(本番)

# 非公開側(boat-scenario-pro)の全レース検証が、結果を保存すると、days/日付.json を、この公開リポジトリに送ってくる。
# それをきっかけに、自動で動画を作る。手動で「Run workflow」を押しても動く。
# できるもの: 動画(mp4)・概要欄の文章(description.txt。場ごとのチャプターつき)。
#   実行ページの下の Artifacts からダウンロードする(30日で消える)。
# できあがったら、YouTubeにも自動で投稿する(.github/workflows/upload_youtube.py)。公開設定は、下の privacy で決まる。
#   音声が dummy の実行と、privacy が skip の実行では、投稿しない。
on:
  push:
    paths:
      - "days/*.json"
  workflow_dispatch:
    inputs:
      date:
        description: "動画にする日(YYYY-MM-DD。例 2026-11-02)。空欄なら、days の中の、いちばん新しい日"
        required: false
        default: ""
      voice:
        description: "voicevox=本番の声(青山龍星) / dummy=音声なしの映像確認用(早い)"
        required: true
        type: choice
        options: [voicevox, dummy]
        default: voicevox
      privacy:
        description: "YouTubeの公開設定。private=非公開 / unlisted=限定公開 / public=公開 / skip=投稿しない"
        required: true
        type: choice
        options: [private, unlisted, public, skip]
        default: private

permissions:
  contents: read

concurrency:
  group: allrace-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 動画にする日を決める
        id: d
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          DATE_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$DATE_INPUT" ]; then
              if ! echo "$DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! date -d "$DATE_INPUT" +%Y%m%d > /dev/null 2>&1; then
                echo "::error::日付の形式が正しくありません。2026-11-02 のように入力してください(入力: $DATE_INPUT)"
                exit 1
              fi
              DATE_ARG="$(date -d "$DATE_INPUT" +%Y%m%d)"
            fi
          else
            # 送られてきたファイル(今回の更新で変わった days/日付.json)の、いちばん新しい日
            DATE_ARG="$(git diff-tree --no-commit-id --name-only -r HEAD -- days | sed -n 's#^days/\([0-9]\{8\}\)\.json$#\1#p' | sort | tail -1)"
          fi
          echo "date=$DATE_ARG" >> "$GITHUB_OUTPUT"
          echo "動画にする日: ${DATE_ARG:-(いちばん新しい日)}"

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものを入れる(ffmpeg・日本語フォント・Playwright)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install playwright numpy
          playwright install --with-deps chromium

      - name: VOICEVOXエンジンを起動(Docker)
        if: github.event.inputs.voice != 'dummy'
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:50021/version > /dev/null; then echo "VOICEVOX ready"; exit 0; fi
            sleep 3
          done
          echo "::error::VOICEVOXエンジンが起動しませんでした"
          docker logs voicevox || true
          exit 1

      - name: 動画を作る
        env:
          DATE_ARG: ${{ steps.d.outputs.date }}
          VOICE_INPUT: ${{ github.event.inputs.voice || 'voicevox' }}
        run: |
          python build_allrace_video.py --date "$DATE_ARG" --voice "$VOICE_INPUT" --out out

      - name: 動画を保存(Actionsの画面の下の Artifacts からダウンロード)
        uses: actions/upload-artifact@v4
        with:
          name: boat-allrace-video-${{ steps.d.outputs.date || 'latest' }}
          path: |
            out/*.mp4
            out/description.txt
            out/timeline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: YouTubeに投稿
        if: github.event.inputs.voice != 'dummy' && github.event.inputs.privacy != 'skip'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # 自動で動くとき(days が届いたとき)の公開設定。審査が通ったら、private を public に変える
          YT_PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
        run: |
          pip install requests
          python .github/workflows/upload_youtube.py
