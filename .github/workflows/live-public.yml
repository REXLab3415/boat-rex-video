name: 直前買い目の自動掲載(毎日・公開側で実行)

# 毎日、各レースの締切の約13〜18分前に、公式の直前情報を読み込んで、1コース先マイの買い目(5つの帯)を出し、
# サイト(出走表ページ)の買い目の枠を、自動で切り替える。
#   ・見張りと計算: boat-scenario-pro の live_run.py(非公開側のコードを、鍵 BSP_TOKEN で取り出して、ここで動かす。公開側の実行時間は無料)
#   ・買い目の置き場: この boat-rex-video の「live-data」という別の枝(本番の枝とは別。ここに書いても、動画などの自動実行は動かない)
#   ・サイト側: 出走表ページが、置き場の買い目を自分で取りに行って、枠を切り替える(news_build.py が、ページに部品を入れる)
#   ・直前情報が間に合わなかったレースは、朝の買い目のまま
# 公式への取得は、official_fetch.fetch() だけを使う(3秒あけ・403で中止・429で中止・停止の目印)。
# 動くのは、日本時間の 7:15〜23:30 の間だけ(朝の更新・0時の毎晩の検証と、公式への取得を重ねないため)。
# 1回の実行は最大330分(GitHubの1実行は最大6時間)。最終レースの締切まで1回では足りないので、330分で終わったとき、続きのレースが残っていれば、
# 最後の段で次の実行を自分で起動する(取れたレースは引き継ぎ、取り直さない)。全レースが決まったら、そこで終わる。
# 重ならないように、順番に待って動く(1つ動いている間に来た予定は、あとから続きを動かす)。
# 買い目はログに出さない(公開側の実行の記録は誰でも見られるため。出すのは、状態・取れた時刻・回数だけ)。
#
# 必要な秘密の値(boat-rex-video の Settings → Secrets and variables → Actions。すでに登録済み)
#   BSP_TOKEN : boat-scenario-pro を読み書きするための鍵

on:
  schedule:
    # 日本時間 7:17 / 7:47 / 8:17 / 12:47 / 18:17(UTCで書くので、日本時間−9時間)。
    # GitHubの予定は遅れることがあるので、朝は3回ずらして入れてある(あとから来た分は、前の実行が終わるのを待つ)
    - cron: "17 22 * * *"
    - cron: "47 22 * * *"
    - cron: "17 23 * * *"
    - cron: "47 3 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "対象の日(YYYY-MM-DD。例 2026-11-24)。空欄なら、今日(日本時間)"
        required: false
        default: ""
      minutes:
        description: "動かす長さ(分)。空欄なら330。最大330。23:30になったら、この長さの途中でも止まる"
        required: false
        default: "330"

permissions:
  contents: write
  actions: write      # 続きのレースがあるとき、次の実行を自分で起動するため

concurrency:
  group: live-prod
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # 動かす最大330分 + 準備と保存
    steps:
      - name: 必要な秘密の値がそろっているか確認
        env:
          T1: ${{ secrets.BSP_TOKEN }}
        run: |
          [ -n "$T1" ] || { echo "::error::秘密の値 BSP_TOKEN が登録されていません"; exit 1; }

      - name: 入力を確認
        id: input
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
          MIN_INPUT: ${{ github.event.inputs.minutes }}
        run: |
          D=""
          if [ -n "$DATE_INPUT" ]; then
            if ! echo "$DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! date -d "$DATE_INPUT" +%Y%m%d > /dev/null 2>&1; then
              echo "::error::日付の形式が正しくありません。2026-11-24 のように入力してください(入力: $DATE_INPUT)。公式にはアクセスしていません"
              exit 1
            fi
            D="$(date -d "$DATE_INPUT" +%Y%m%d)"
          fi
          M="${MIN_INPUT:-330}"
          if ! echo "$M" | grep -Eq '^[0-9]{1,3}$'; then
            echo "::error::動かす長さは、数字(分)で入れてください(入力: $MIN_INPUT)。公式にはアクセスしていません"
            exit 1
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "minutes=$M" >> "$GITHUB_OUTPUT"

      - name: 非公開側(boat-scenario-pro)を取得
        id: co
        uses: actions/checkout@v4
        with:
          repository: REXLab3415/boat-scenario-pro
          ref: main
          token: ${{ secrets.BSP_TOKEN }}

      - name: 追加したファイルがそろっているか確認
        run: |
          ng=0
          for f in live_run.py live_picks.py news_build.py; do
            [ -f "$f" ] || { echo "::error::boat-scenario-pro に $f がありません(アップロードを確認してください)"; ng=1; }
          done
          grep -q "LIVE_JS" news_build.py || { echo "::error::news_build.py が古い版です(買い目の自動切り替えの部品がありません)"; ng=1; }
          exit $ng

      # 公式サイトに「拒否(403)」されたあとは、停止の目印(fetch_stopped.flag)が残る。目印がある間は、公式にアクセスしない
      - name: 停止の目印を確認
        run: |
          if [ -f fetch_stopped.flag ]; then
            echo "::error::公式サイトからの取得は停止中です(fetch_stopped.flag があります)。公式にはアクセスしません"
            exit 1
          fi

      # 買い目の置き場(live-data の枝)が、まだ無ければ、作る(最初の1回だけ)
      - name: 買い目の置き場(live-data の枝)を用意
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" live-data > /dev/null 2>&1; then
            echo "置き場(live-data)は、すでにあります"
          else
            rm -rf /tmp/livedata_init && mkdir /tmp/livedata_init && cd /tmp/livedata_init
            git init -q
            git config user.name "live-bot"
            git config user.email "actions@users.noreply.github.com"
            git checkout -q --orphan live-data
            mkdir -p live
            echo "直前情報を読み込んだあとの買い目の置き場(自動で書き込まれます)" > live/README.txt
            git add -A
            git commit -q -m "live-data: 置き場を作成"
            git push -q "$URL" live-data
            echo "置き場(live-data)を作りました"
          fi

      - name: 買い目の置き場を取得
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: live-data
          path: pub
          token: ${{ github.token }}

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 画面の計算・出走表PDFの読み取りに使う部品を用意
        run: |
          pip install pdfplumber playwright
          python -m playwright install --with-deps chromium

      - name: 直前情報を見張って、買い目を出す
        id: run
        continue-on-error: true      # 途中で失敗しても、できた分の保存はする。最後の段で、失敗(赤)にする
        env:
          LIVE_DATE: ${{ steps.input.outputs.date }}
          LIVE_MINUTES: ${{ steps.input.outputs.minutes }}
          LIVE_PUB_DIR: ${{ github.workspace }}/pub
        run: |
          git -C pub config user.name "live-bot"
          git -C pub config user.email "actions@users.noreply.github.com"
          python live_run.py

      - name: 結果を保存(非公開側の live_test だけ。取得が止められたときは、停止の目印も)
        if: always() && steps.co.outcome == 'success'
        run: |
          git config user.name "boat-scenario-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -d live_test ] && git add live_test/ 2>/dev/null || true
          if [ -f fetch_stopped.flag ]; then git add fetch_stopped.flag; fi
          if git diff --quiet --cached; then
            echo "::notice::保存する内容はありません"
          else
            git commit -q -m "live: $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push
          fi

      # 330分で終わって、続きのレースが残っているときだけ(live_run.py が目印 live_handoff.flag を作る)、次の実行を起動する。
      # 起動した実行は、この実行が終わるまで順番を待つ(上の concurrency)。起動に失敗しても、上の予定の実行(12:47・18:17)が予備になる
      - name: 続きのレースがあれば、次の実行を起動
        if: always() && steps.co.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f live_handoff.flag ]; then
            D="$(tr -d '[:space:]' < live_handoff.flag)"
            if echo "$D" | grep -Eq '^[0-9]{8}$'; then
              gh workflow run live-public.yml --repo "${{ github.repository }}" -f date="${D:0:4}-${D:4:2}-${D:6:2}" -f minutes=330 \
                && echo "次の実行を起動しました(対象 $D)" \
                || echo "::warning::次の実行を起動できませんでした。予備の予定の実行(日本時間12:47・18:17)で続きます"
            else
              echo "::warning::引き継ぎの目印の中身が日付ではありません: $D"
            fi
          else
            echo "続きのレースはありません(全レースが決まったか、時間の上限まで来ました)"
          fi

      - name: 失敗していたら、失敗で終える
        if: always() && steps.run.outcome == 'failure'
        run: |
          echo "::error::直前情報の見張り・買い目の計算で、失敗しました(上の「直前情報を見張って、買い目を出す」のログと、実行の画面の一番上のSummaryを見てください)。できた分の保存は済んでいます"
          exit 1
