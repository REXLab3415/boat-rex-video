name: 毎日のデータ自動更新(公開側で実行)

# boat-rex-video(公開側)で動かす。非公開側(boat-scenario-pro)のコードとデータを、鍵 BSP_TOKEN で取り出して処理し、
# 結果を非公開側へ書き戻す。公開側の実行時間は無料。実行の記録は誰でも見られるので、データの中身は、記録に出さないこと。

on:
  schedule:
    - cron: "0 18 * * *"   # 日本時間 3:00(早い回。全レース検証と動画のあと。前日の結果が公式にまだ無ければ、7:00の回で取る)
    - cron: "0 22 * * *"   # 日本時間 7:00(完成版)
  workflow_dispatch:
    inputs:
      date:
        description: "取得する日(YYYY-MM-DD。例 2026-10-02)。空欄なら、いつもの動き(日本時間の前日から7日の範囲で、保存されていない日を取る)"
        required: false
        default: ""

permissions:
  contents: write     # 前日の動画の材料(days/日付.json)が無いとき、この公開側に置くため(それ以外は、公開側に何も書かない。非公開側への書き込みは BSP_TOKEN で行う)
  actions: write      # 動画づくり・全レース検証を、起動するため

concurrency:
  group: boat-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 非公開側(boat-scenario-pro)を取得
        uses: actions/checkout@v4
        with:
          repository: REXLab3415/boat-scenario-pro
          ref: main
          token: ${{ secrets.BSP_TOKEN }}

      # 前日の分の状態を、更新の前に記録しておく(7:00の更新で、前日の出走表は消えるため)。最後の「前日の取り戻し」で使う。何も変えない
      - name: 前日の分の状態を記録(取り戻しの判断用)
        id: prev
        continue-on-error: true
        run: |
          D="$(TZ=Asia/Tokyo date -d yesterday +%Y%m%d)"
          echo "d=$D" >> "$GITHUB_OUTPUT"
          if [ -f "allrace_out/$D/check.json" ]; then echo "saved=yes" >> "$GITHUB_OUTPUT"; else echo "saved=no" >> "$GITHUB_OUTPUT"; fi
          if python3 -c "import json,sys; c=json.load(open('data/race_card_latest.json',encoding='utf-8')); sys.exit(0 if c.get('$D') else 1)" 2>/dev/null; then echo "card=yes" >> "$GITHUB_OUTPUT"; else echo "card=no" >> "$GITHUB_OUTPUT"; fi

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 公式サイトに「拒否(403)」されたあとは、停止の目印(fetch_stopped.flag)が残る。目印がある間は、公式にアクセスしない
      # (今あるデータの公開だけ行う)。再開の手順は、停止手順書を見る。
      - name: 停止の目印を確認
        id: guard
        run: |
          if [ -f fetch_stopped.flag ]; then
            echo "stopped=true" >> "$GITHUB_OUTPUT"
            echo "::warning::公式サイトからの取得は停止中です(fetch_stopped.flag があります)。取得はせず、今あるデータの公開だけ行います。再開の手順は、停止手順書を見てください"
          else
            echo "stopped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 前日分を取得して集計
        id: fetch
        if: steps.guard.outputs.stopped != 'true'
        continue-on-error: true      # 取得に失敗しても、公開(今あるデータ)は止めない。最後の段で、失敗(赤)にする
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            # 手動で日付が入力されたとき: その1日だけを取る。形式が違うときは、公式にアクセスせずに止める
            if ! echo "$DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! date -d "$DATE_INPUT" +%Y%m%d > /dev/null 2>&1; then
              echo "::error::取得する日の形式が正しくありません。2026-10-02 のように、年-月-日 で入力してください(入力: $DATE_INPUT)。公式にはアクセスしていません"
              exit 1
            fi
            python boat_data.py --date "$(date -d "$DATE_INPUT" +%Y%m%d)"
          else
            python boat_data.py --daily
          fi

      # 実績表(2着・3着の来方など)を、毎日、作り直す。
      # ここで失敗しても、毎日の更新(選手データ・出走表など)は止めない。
      # 失敗したときは、前回の data/chaku_stats.json をそのまま残す(build_chaku_stats.py は、成功したときだけ置き換える)。
      - name: 実績表を更新(失敗しても止めない)
        run: |
          python build_chaku_stats.py || echo "::warning::実績表の更新に失敗しました。前回の data/chaku_stats.json をそのまま使います"
          rm -f data/chaku_stats.json.tmp || true

      - name: 更新されたデータをコミット
        run: |
          git config user.name "boat-scenario-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if [ -f fetch_stopped.flag ]; then git add fetch_stopped.flag; fi
          git diff --quiet --cached || git commit -m "daily data update: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push

      # ここから、Cloudflare Workersへの公開。
      # Netlifyのような「後から自動で気づいて公開する」方式ではなく、
      # この場で直接「今すぐ公開しろ」と命令するので、公開の取りこぼしが起きない。
      - name: 公開用フォルダを作る
        run: |
          mkdir -p public/data
          cp boat_scenario_pro.html public/index.html
          if [ -f boat_scenario_pro_test.html ]; then cp boat_scenario_pro_test.html public/test.html; fi   # 確認用の画面(/test)。ログインが必要
          cp -r data/. public/data/
          rm -rf public/data/raw
          rm -f public/data/*_store.json.gz
          if [ -f venue_profile.json ]; then cp venue_profile.json public/; fi

      - name: Cloudflare Workersへ公開
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      # ここから、全場の出走表(オリジナル新聞)。ツール本体の公開は、上で済んでいる。
      # この段は、どこで失敗しても(continue-on-error)、ツールの公開・毎日の更新には影響しない。
      - name: 全場の出走表の材料を足す(前日分の、優勝戦・グレード・着順の記号)
        id: news_extra
        if: steps.guard.outputs.stopped != 'true'
        continue-on-error: true
        run: python news_extra.py --daily

      - name: 全場の出走表を作る準備①(PDFの読み取りと、画面の計算の部品)
        id: news_setup
        continue-on-error: true
        run: |
          python --version
          python -m pip --version
          python -m pip install pdfplumber playwright

      - name: 全場の出走表を作る準備②(画面の計算に使うブラウザ。入らなくても、買い目なしで出走表は作る)
        id: news_browser
        if: steps.news_setup.outcome == 'success'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: 全場の出走表を作る(24場のPDF・番組表・保存データ。画面だけを news_public に作る)
        id: news_build
        if: steps.guard.outputs.stopped != 'true' && steps.news_setup.outcome == 'success'
        continue-on-error: true
        run: python news_build.py

      - name: 全場の出走表の公開先(Cloudflare Pages)を用意(すでにあれば、何も起きない)
        if: steps.news_build.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages project create boat-rex-news --production-branch=main

      - name: 全場の出走表を公開(Cloudflare Pages)
        id: news_deploy
        if: steps.news_build.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy news_public --project-name=boat-rex-news --branch=main

      - name: 全場の出走表の材料(news_data)を保存(コミット)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "boat-scenario-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -d news_data ]; then git add -f news_data; fi
          if [ -f data/race_card_latest.json ]; then git add data/race_card_latest.json; fi
          git diff --quiet --cached || git commit -m "全場の出走表の材料: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push

      - name: 全場の出走表の結果を表示(公開できていなければ、この回を赤で終える。見張りが、やり直す)
        if: always()
        run: |
          echo "材料の追加: ${{ steps.news_extra.outcome }} / 準備①: ${{ steps.news_setup.outcome }} / 準備②(ブラウザ): ${{ steps.news_browser.outcome }} / 作成: ${{ steps.news_build.outcome }} / 公開: ${{ steps.news_deploy.outcome }}"
          # 公式サイトからの取得を止めている間(停止の目印あり)は、出走表を作らないので、赤にしない
          if [ "${{ steps.news_deploy.outcome }}" != "success" ] && [ "${{ steps.guard.outputs.stopped }}" != "true" ]; then
            echo "::error title=出走表を公開できませんでした::全場の出走表は、今日は公開できませんでした(ツール本体は公開済みです)。上の各段のログを見てください。見張りが、自動でやり直します"
            exit 1
          fi

      # ---- 前日の取り戻し(毎日の更新が、あとから自動で直す。公式サイトには、ここではアクセスしない) ----
      # 0:00の全レース検証が、失敗・遅れで、動画の材料(days/日付.json)を置けなかった日を、自動で直す。
      #   ・前日の結果が保存されていない: 出走表が残っているあいだ(7:00の更新まで)は、全レース検証をやり直す
      #   ・保存されているのに、公開側に材料が無い: 保存済みの結果から材料を置いて、動画づくりを起動する
      #   ・すでに材料がある・動画が上がっている: 何もしない
      - name: 公開側(boat-rex-video)を pub フォルダに取得(前日の取り戻し用)
        id: pubco
        if: always() && steps.prev.outputs.d != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: pub

      - name: 前日の動画の材料を確認して、無ければ取り戻す
        id: heal
        if: always() && steps.prev.outputs.d != '' && steps.pubco.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.prev.outputs.d }}
          SAVED: ${{ steps.prev.outputs.saved }}
          CARD: ${{ steps.prev.outputs.card }}
        run: |
          # GitHub側の一時的なエラーで、書き込みや起動が断られることがある。最大5回、30秒あけてやり直す
          retry() { n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::失敗しました。30秒あけて、やり直します($n/5)"; sleep 30; done; }
          push_once() { git pull --rebase origin main || true; git push; }
          start_video() { gh workflow run video.yml --repo REXLab3415/boat-rex-video --ref main -f date="$(date -d "$D" +%Y-%m-%d)"; }
          start_check() { gh workflow run allrace-run-public.yml --repo REXLab3415/boat-rex-video --ref main -f source=cloudflare -f date="$(date -d "$D" +%Y-%m-%d)"; }
          if [ "$SAVED" != "yes" ]; then
            if [ "$CARD" = "yes" ]; then
              echo "::warning::${D} の全レース検証が、保存されていません。出走表が残っているので、全レース検証をやり直します"
              retry start_check || { echo "::error title=全レース検証を起動できません::${D}: 5回とも失敗しました"; exit 1; }
              echo "::notice::${D} の全レース検証を起動しました(この回が終わったあとに動きます)"
              exit 0
            fi
            echo "::error title=前日の全レース検証がありません::${D} の全レース検証が保存されておらず、出走表も残っていないため、取り戻せません"
            exit 1
          fi
          if [ -f "pub/days/$D.json" ] || [ -f "pub/uploaded/$D.json" ]; then
            echo "::notice::${D} の動画の材料は、公開側にすでにあります。何もしません"
            exit 0
          fi
          echo "::warning::${D} は保存済みですが、公開側に動画の材料が無いので、置いて、動画づくりを起動します"
          mkdir -p video_data pub/days
          python3 make_video_data.py "$D" "video_data/$D.json" || { echo "::error title=動画の材料を作れません::${D}: make_video_data.py が失敗しました"; exit 1; }
          cp "video_data/$D.json" "pub/days/$D.json"
          cd pub
          git config user.name "boat-scenario-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add days
          if git diff --cached --quiet; then
            echo "::notice::${D}: 置く内容は、すでに公開側と同じです"
          else
            git commit -m "days: $D"
            retry push_once || { echo "::error title=動画の材料を書き込めません::${D}: git push が5回とも断られました"; exit 1; }
          fi
          retry start_video || { echo "::error title=動画づくりを起動できません::${D}: 5回とも失敗しました"; exit 1; }
          echo "::notice::${D} の動画の材料を置き、動画づくり(video.yml)を起動しました"

      # 取得に失敗した(中止した)ときは、公開まで済ませたあとで、この回を失敗(赤)で終える
      - name: 取得に失敗していたら、失敗で終える
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::公式サイトからの取得を中止しました(上の取得のログを見てください)。公開は、今あるデータで済ませています。"
          exit 1

      - name: 失敗をメールで知らせる
        if: failure() || steps.fetch.outcome == 'failure' || steps.heal.outcome == 'failure'
        continue-on-error: true
        env:
          MAIL_USER: sg34153415@gmail.com
          MAIL_TO: sg34153415@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTE: "毎日の更新(または、前日の動画の取り戻し)が、うまくいきませんでした。ツール本体は、今あるデータで公開されています。"
        run: python3 pub/notify_fail.py
