name: 全レース検証(公開側で実行)

# boat-rex-video(公開側)で動かす。非公開側(boat-scenario-pro)のコードとデータを、鍵 BSP_TOKEN で取り出して処理し、
# 保存(allrace_out)は非公開側へ書き戻す。動画の材料(days/日付.json)は、この公開側にそのまま置き、動画づくり(video.yml)を起動する。
# 公開側の実行時間は無料。実行の記録は誰でも見られるので、取ったページ(run_out)の保存は付けていない。
# 非公開側の同名の流れ(全レース検証(毎晩の本番))と、同じ日を二重に動かさないよう、「保存済みなら止まる」の仕組みは元のまま。
on:
  schedule:
    - cron: "0 15 * * *"      # 日本時間 0:00(GitHubの予定の実行は、数時間遅れることがある。公開側では、この予定が本線)
  workflow_dispatch:
    inputs:
      date:
        description: "対象の日(YYYY-MM-DD。例 2026-10-31)。空欄なら、保存済みの出走表のうち、今日以前でいちばん新しい日"
        required: false
        default: ""
      source:
        description: "合図の目印(Cloudflareが自動で入れる。手で動かすときは、空欄のまま)"
        required: false
        default: ""

permissions:
  contents: write      # この公開側に days/日付.json を置くため(非公開側への書き込みは BSP_TOKEN)
  actions: write       # video.yml を起動するため

concurrency:
  group: boat-data-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75      # 全場(約325回・3秒あけて約17分)+計算
    steps:
      - name: 非公開側(boat-scenario-pro)を取得
        uses: actions/checkout@v4
        with:
          repository: REXLab3415/boat-scenario-pro
          ref: main
          token: ${{ secrets.BSP_TOKEN }}

      - name: 公開側(boat-rex-video)を pub フォルダに取得
        uses: actions/checkout@v4
        with:
          path: pub

      - name: 対象の日の分が保存済みか確認(予定の実行・Cloudflareの合図のときだけ。手で動かしたときは、必ず動く)
        id: skip
        env:
          SOURCE_INPUT: ${{ github.event.inputs.source }}
        run: |
          # 対象の日は、allrace_run.py と同じ決め方: 保存済みの出走表のうち、今日(日本時間)以前でいちばん新しい日。
          # GitHubの予定の実行は、日付をまたいで遅れることがあるため、「今日」には決め打ちしない。
          TARGET="$(python3 -c "import json,datetime; t=(datetime.datetime.utcnow()+datetime.timedelta(hours=9)).strftime('%Y%m%d'); c=json.load(open('data/race_card_latest.json',encoding='utf-8')); k=[x for x in c if x<=t and c[x]]; print(max(k) if k else '')" 2>/dev/null || true)"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "$SOURCE_INPUT" = "cloudflare" ]; } && [ -n "$TARGET" ] && [ -f "allrace_out/$TARGET/check.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TARGET の分は、保存済みです。何もせず終わります。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Pythonをセットアップ
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 停止の目印を確認
        run: |
          if [ -f fetch_stopped.flag ]; then
            echo "::error::公式サイトからの取得は停止中です(fetch_stopped.flag があります)。公式にはアクセスしません。"
            exit 1
          fi

      - name: 画面の計算に使うブラウザを用意
        if: steps.skip.outputs.skip != 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 取得・計算・答え合わせ
        id: run
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true      # 途中で失敗しても、できた分の保存は行う。最後の段で、失敗(赤)にする
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: |
          DATE_ARG=""
          if [ -n "$DATE_INPUT" ]; then
            if ! echo "$DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! date -d "$DATE_INPUT" +%Y%m%d > /dev/null 2>&1; then
              echo "::error::日付の形式が正しくありません。2026-10-31 のように入力してください(入力: $DATE_INPUT)。公式にはアクセスしていません"
              exit 1
            fi
            DATE_ARG="$(date -d "$DATE_INPUT" +%Y%m%d)"
          fi
          rc=0
          python allrace_run.py $DATE_ARG || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice::まだ全レースが終わっていないため、何も保存せず止まりました。全レース終了後に、もう一度動かしてください。"
            exit 0
          fi
          exit $rc

      - name: 結果を保存(allrace_out だけ)
        id: save
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "boat-scenario-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add allrace_out/ 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "allrace run: $(date -u +'%Y-%m-%d %H:%M')"
            D="$(git diff-tree --no-commit-id --name-only -r HEAD | sed -n 's#^allrace_out/\([0-9]\{8\}\)/check\.json$#\1#p' | head -1)"
            echo "date=$D" >> "$GITHUB_OUTPUT"
          fi
          git pull --rebase origin main || true
          git push

      - name: 動画の材料を、公開側に置いて、動画づくりを起動する(新しく保存したとき。保存済みの日は、公開側に無いときだけ)
        id: send
        if: ${{ (steps.skip.outputs.skip == 'true' && steps.skip.outputs.target != '') || (steps.run.outcome == 'success' && steps.save.outputs.date != '') }}
        continue-on-error: true      # 失敗しても保存は成功のまま。ただし、最後の手順で実行を赤にする
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED: ${{ steps.save.outputs.date }}
          TARGET: ${{ steps.skip.outputs.target }}
        run: |
          D="${SAVED:-$TARGET}"
          if [ -z "$SAVED" ] && [ -f "pub/days/$D.json" ]; then
            echo "::notice::${D} の材料は、公開側にすでにあります。送りません"
            exit 0
          fi
          if [ -z "$SAVED" ]; then
            echo "::notice::${D} は保存済みですが、公開側にまだ無いので、置きます"
          fi
          python3 make_video_data.py "$D" "video_data/$D.json" || { echo "::error title=動画の材料を作れません::${D}: make_video_data.py が失敗しました(上のログを見てください)"; exit 1; }
          mkdir -p pub/days
          cp "video_data/$D.json" "pub/days/$D.json"
          cd pub
          git config user.name "boat-scenario-pro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add days
          if git diff --cached --quiet; then
            echo "::notice::${D}: 置く内容は、前回と同じです"
          else
            git commit -m "days: $D"
            git pull --rebase origin main || true
            git push
            # この実行からの保存(push)では、video.yml は自動で動かないため、直接起動する
            gh workflow run video.yml --repo REXLab3415/boat-rex-video --ref main -f date="$(date -d "$D" +%Y-%m-%d)"
            echo "::notice::${D} の動画の材料を置き、動画づくり(video.yml)を起動しました"
          fi

      - name: 失敗していたら、失敗で終える
        if: steps.run.outcome == 'failure' || steps.send.outcome == 'failure'
        run: |
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            echo "::error::取得・計算・答え合わせのどこかで失敗しました(上の「取得・計算・答え合わせ」のログを見てください)"
          fi
          if [ "${{ steps.send.outcome }}" = "failure" ]; then
            echo "::error::動画の材料を置く・動画づくりを起動する、のどこかで失敗しました(保存は済んでいます)。上の「動画の材料を、公開側に置いて」のログを見てください"
          fi
          exit 1
